name: interactsh-redis-test

# Two interactsh-server instances pointing at the same Redis to exercise
# the multi-instance scenario from issue #1267. Both run with --skip-acme
# (TLS disabled) and authentication so the test harness can register/poll
# without dragging in real DNS or ACME.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 10

  ish-a:
    build:
      context: ../..
      dockerfile: deploy/redis-test/Dockerfile
    command:
      - "-d=oast.local"
      - "-i=127.0.0.1"
      - "-sa"
      - "-ru=redis://redis:6379"
      - "-rp=ishtest:"
      - "-dns-port=5353"
      - "-smtp-port=2525"
      - "-smtp-autotls-port=2526"
      - "-smtps-port=2527"
      - "-ldap-port=3389"
      - "-ftp-port=2121"
      - "-ftps-port=2122"
      - "-smb-port=4445"
      - "-a"
      - "-t=testtoken-7e2c"
    ports:
      - "8080:80"
    depends_on:
      redis:
        condition: service_healthy

  ish-b:
    build:
      context: ../..
      dockerfile: deploy/redis-test/Dockerfile
    command:
      - "-d=oast.local"
      - "-i=127.0.0.1"
      - "-sa"
      - "-ru=redis://redis:6379"
      - "-rp=ishtest:"
      - "-dns-port=5353"
      - "-smtp-port=2525"
      - "-smtp-autotls-port=2526"
      - "-smtps-port=2527"
      - "-ldap-port=3389"
      - "-ftp-port=2121"
      - "-ftps-port=2122"
      - "-smb-port=4445"
      - "-a"
      - "-t=testtoken-7e2c"
    ports:
      - "8081:80"
    depends_on:
      redis:
        condition: service_healthy
